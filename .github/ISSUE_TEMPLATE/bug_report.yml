name: Bug report
description: Report something that is not working correctly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ./deploy/install.sh --port 8090
        2. Open http://localhost:8090
        3. ...
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 15.2 / Arch Linux"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ResourceWatch version
      description: Output of `curl -s localhost:8090/api/health`, or the commit SHA.
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - deploy/install.sh (systemd)
        - deploy/install.sh (launchd / macOS)
        - scripts/prod.sh
        - Built manually with cargo
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`journalctl -u resourcewatch -n 50`, or the contents of logs/prod.log."
      render: shell
