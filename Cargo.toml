[package]
name = "resourcewatch"
version = "0.2.0"
edition = "2024"
description = "Real-time system resource monitoring with WebSocket streaming, SQLite history, and a single-binary web dashboard"
repository = "https://github.com/frammawiliansyah/resourcewatch"
license = "MIT"
readme = "README.md"
keywords = ["monitoring", "metrics", "system", "dashboard", "observability"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
nvml-wrapper = "0.13.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
starship-battery = "0.11.1"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
toml = "1.1.5"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace", "cors", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
